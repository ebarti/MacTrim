[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mactrim"
version = "0.2.0"
description = "Evidence-led, reversible Mac cleanup"
requires-python = ">=3.9"
dependencies = ["textual==8.2.8", "rich>=14,<15"]

[project.scripts]
mactrim = "mactrim.cli:main"

[tool.setuptools]
packages = ["mactrim"]
